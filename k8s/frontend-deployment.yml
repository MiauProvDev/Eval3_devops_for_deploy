apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-despacho
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-despacho
  template:
    metadata:
      labels:
        app: frontend-despacho
    spec:
      containers:
        - name: frontend-despacho
          image: ${FRONTEND_DESPACHO_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_HOST
              value: "backend-ventas"
            - name: BACKEND_HOST_DESPACHOS
              value: "backend-despachos"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
